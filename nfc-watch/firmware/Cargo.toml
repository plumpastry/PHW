[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

defmt = "1.0.1"
defmt-rtt = "1.1.0"

embassy-executor = { version = "0.9.1",  features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-nrf = { version = "0.9.0", features = ["defmt", "nrf54l15-app-s", "time-driver-grtc", "gpiote", "time"] }
embassy-time = "0.5.0"

panic-probe = "1.0.0"
portable-atomic = "1.13.1"
static_cell = "2.1.1"

[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/nrf54l15" }
]

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false
doctest = false
bench = false
